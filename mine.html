    <p class="lede">你在這台裝置上說過的話會留在這裡。這一頁只給你自己看，
      是為了讓你知道那些話還在、走到哪一步了。</p>
    <p class="hint">留言送出後會先經過人工檢視，通過才會出現在牆上。檢視期間它也會列在這裡，
      你不會找不到自己剛剛說的話。</p>
    <p class="hint">這裡沒有分享或下載——說出來這件事的重量不該變成一張可以轉發的圖。
      這面牆會替你留著。</p>
    <ul class="share-list" data-share-list></ul>
    <p class="hint" data-share-empty>你還沒有在這台裝置上說過話。<a href="index.html#compose">現在說一句</a>也可以。</p>
