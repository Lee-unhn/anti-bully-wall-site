<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>這面牆</title>
<meta name="description" content="匿名說出被霸凌的經歷，其他人只能給你溫暖。">
<!-- frame-ancestors 不寫在這裡：meta 版的 CSP 不支援它（瀏覽器會忽略並報錯），
     那一條留在 _headers 給 Cloudflare。
     CSP 用 meta 而不是只靠 _headers：_headers 是 Cloudflare Pages 專用，
     GitHub Pages 完全不讀它（實測線上 404），CSP 因此不會生效。
     meta 版換到任何靜態主機都有效，兩者並存不衝突。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="styles.css?v=3ed1143d">
</head>
<body class="shell-layout">

<p class="demo-notice" data-c="demoNotice" hidden></p>

<div class="shell-main">

  <header class="site-mark">
    <h1 data-c="site.title">—</h1>
    <p class="tagline" data-c="site.tagline">—</p>
    <p class="wall-scale" data-wall-scale>—</p>
    <ul class="triage" data-c="triage"></ul>
    <p class="alias-line">你在這裡叫做 <strong data-c="alias">—</strong>，沒有人知道那是誰。</p>
  </header>

  <main>

  <section id="wall" class="wall-region" aria-labelledby="wall-h">
    <h2 id="wall-h" class="sr-only">留言牆</h2>

    <!-- ⛔ 這裡原本有三顆鈕：流動／全部攤開／回到原點。2026-08-31 全部拿掉
         （Lee：好像可以不用，直接流動）。牆永遠是流動的，沒有檢視模式可切。
         ⛔ 靜態版沒有消失，只是不再是使用者選項：系統開了 prefers-reduced-motion
         的人自動拿到它（G11 在守）。那是他們自己對作業系統下的設定，
         靜態就是正確結果，不需要再問他要不要。 -->
    <div class="wall-toolbar">
      <span class="wall-status hint" data-c="wall.status">載入中…</span>
    </div>

    <!-- wall-frame 不捲動，只負責左右兩道淡出；捲動的是裡面的 wall-stage。
         淡出若直接掛在捲動容器上會跟著內容一起捲走。 -->
    <div class="wall-frame">
      <div class="wall-stage" data-wall-stage></div>
    </div>

  </section>

  <!-- 送出入口常駐在底部：這個站的核心動作是「說出來」，藏進對話框會掉轉換 -->
  <section id="compose" class="composer-bar" aria-labelledby="compose-h">
    <h2 id="compose-h" class="sr-only">說你想說的</h2>
    <form class="compose" data-compose>
      <label for="compose-body" data-c="wall.composePrompt">—</label>
      <div class="composer-row">
        <textarea id="compose-body" name="body" rows="1" required></textarea>
        <button type="submit">送出</button>
      </div>
      <span class="hint" data-compose-count>0 / 300</span>
    </form>
    <p class="notice" data-compose-notice hidden></p>
  </section>

  </main>

</div>

<!-- 右側面板（桌機）／底部 tab（手機）由 shell.js 從 content.nav 注入 -->
<div data-shell></div>

<dialog class="help-dialog" data-help-dialog aria-labelledby="help-dlg-h">
  <h2 id="help-dlg-h">如果你現在很不好受</h2>
  <p class="hint" data-help-why></p>
  <ul class="help-lines">
    <li><a href="tel:1925">衛福部安心專線 1925</a></li>
    <li><a href="tel:1995">生命線 1995</a></li>
    <li><a href="tel:1980">張老師專線 1980</a></li>
  </ul>
  <p class="hint">24 小時，免付費。你不需要準備好才打。</p>
  <button type="button" data-help-close>我知道了</button>
</dialog>

<script src="js/config.js?v=3ed1143d"></script>
<script src="content.js?v=3ed1143d"></script>
<script src="js/prefs.js?v=3ed1143d"></script>
<script src="js/schema.js?v=3ed1143d"></script>
<script src="js/keywords.js?v=3ed1143d"></script>
<script src="js/data-provider.js?v=3ed1143d"></script>
<script src="js/supabase-provider.js?v=3ed1143d"></script>
<script src="js/guard.js?v=3ed1143d"></script>
<script src="js/triage.js?v=3ed1143d"></script>
<script src="js/shell.js?v=3ed1143d"></script>
<script src="js/wall.js?v=3ed1143d"></script>
<script src="js/share.js?v=3ed1143d"></script>
<script src="js/app.js?v=3ed1143d"></script>
</body>
</html>
